name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI can never push, tag, release or touch issues.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      # Actions are pinned to full commit SHAs so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: No dependencies
        run: node -e "const p=require('./package.json'); for (const k of ['dependencies','devDependencies','optionalDependencies','peerDependencies']) if (p[k] && Object.keys(p[k]).length) { console.error(k+' must stay empty'); process.exit(1) }"
      - name: Tests (scoring, injection corpus, security invariants)
        run: npm test
